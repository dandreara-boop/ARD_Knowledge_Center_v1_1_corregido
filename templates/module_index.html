{% extends "base.html" %}
{% block title %}{{ page.title }} — ARD Suite{% endblock %}
{% block body %}
<div class="mobile-bar"><button id="openSidebar" class="icon-button">☰</button><span>{{ page.title }}</span></div>
<div class="app-shell">
  {% include "sidebar.html" %}
  <main class="document-wrap">
    <section class="module-index">
      {% if page.module %}<span class="eyebrow">{{ page.module }}</span>{% endif %}
      <h1>{{ page.title }}</h1>
      <p>{{ page.description }}</p>
      <div class="construction-state">En construcción</div>
    </section>
  </main>
</div>
{% endblock %}
